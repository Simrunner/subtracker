version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: subtracker-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password

  backend:
    build: .
    container_name: subtracker-backend
    ports:
      - '5000:5000'
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/subtracker?authSource=admin
      JWT_SECRET: your_secret_key_here
      NODE_ENV: production
    depends_on:
      - mongodb
    volumes:
      - ./server:/app/server

  frontend:
    build: .
    container_name: subtracker-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./client:/app/client

volumes:
  mongodb_data:
